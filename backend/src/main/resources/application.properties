spring.application.name=altforge-backend

# ===== Server =====
server.port=${PORT:${SERVER_PORT:8080}}

# ===== Multipart =====
# Per-image cap stays at 10 MB; total request bumped to support batches
# (up to 10 images via POST /api/alt-text/batch).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# ===== Gemini Vision =====
altforge.gemini.api-key=${GEMINI_API_KEY:}
altforge.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
altforge.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
altforge.gemini.timeout-seconds=30

# ===== Jackson — drop null fields in outgoing JSON =====
spring.jackson.default-property-inclusion=non_null

# ===== CORS =====
# Comma-separated list of origin patterns allowed to call /api/**.
# Local dev defaults cover the Vite dev server fallback ports.
# In production, override with CORS_ALLOWED_ORIGIN_PATTERNS in your environment.
altforge.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
