spring.application.name=altforge-backend

# ===== Server =====
server.port=${PORT:${SERVER_PORT:8080}}

# ===== Multipart =====
# Per-image cap stays at 10 MB; total request bumped to support batches
# (up to 10 images via POST /api/alt-text/batch).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# ===== Gemini Vision =====
altforge.gemini.api-key=${GEMINI_API_KEY:}
altforge.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
altforge.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
altforge.gemini.timeout-seconds=30

# ===== Jackson — drop null fields in outgoing JSON =====
spring.jackson.default-property-inclusion=non_null

# ===== Datasource (Neon Postgres) =====
# All three values come from the environment; locally they are loaded from
# backend/.env via spring-dotenv. Leaving them empty disables the audit feature
# (the app still serves /api/alt-text and /api/alt-text/batch).
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Small pool — Neon free-tier compute scales to zero, no point keeping many idle connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=900000

# ===== JPA =====
# Flyway owns the schema — JPA only validates it on startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== CORS =====
# Comma-separated list of origin patterns allowed to call /api/**.
# Local dev defaults cover the Vite dev server fallback ports.
# In production, override with CORS_ALLOWED_ORIGIN_PATTERNS in your environment.
altforge.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
