spring.application.name=altforge-backend

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== Multipart (10 MB max image) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Gemini Vision =====
altforge.gemini.api-key=${GEMINI_API_KEY:}
altforge.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
altforge.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
altforge.gemini.timeout-seconds=30

# ===== Jackson — drop null fields in outgoing JSON =====
spring.jackson.default-property-inclusion=non_null
