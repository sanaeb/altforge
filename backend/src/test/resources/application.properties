# Test overrides — uses H2 in PostgreSQL compatibility mode so Flyway can run the
# real migrations against an in-memory schema. Production stays on Neon Postgres.

spring.datasource.url=jdbc:h2:mem:altforge-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
