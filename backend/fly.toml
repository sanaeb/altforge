# Fly.io configuration for the AltForge backend.
# Generated against fly.io schema as of 2026-05.

app = "altforge-backend"
primary_region = "cdg"  # Paris — lowest latency from France

[build]

[env]
  SERVER_PORT = "8080"
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75"
  GEMINI_MODEL = "gemini-2.5-flash-lite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/actuator/health"
